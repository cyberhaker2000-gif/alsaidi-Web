<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الصعيدي التعليمية</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #121212;
      --navbar-bg: #1e1e1e;
      --card-bg: #1a1a1a;
      --text-color: #ffffff;
      --accent-yellow: #ffcc00;
      --accent-hover: #ffd733;
      --border-color: #333333;
      --input-bg: #262626;
      --badge-bg: #2a2a18;
    }

    [data-theme="light"] {
      --bg-color: #fafafa;
      --navbar-bg: #ffffff;
      --card-bg: #ffffff;
      --text-color: #111111;
      --accent-yellow: #ffcc00;
      --accent-hover: #e6b800;
      --border-color: #e2e8f0;
      --input-bg: #f8fafc;
      --badge-bg: #fff9db;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding-top: 85px;
      padding-bottom: 40px;
    }

    .top-navbar-container {
      position: fixed;
      top: 10px; right: 10px; left: 10px;
      z-index: 9999;
      display: flex; align-items: center; justify-content: space-between;
      background-color: var(--navbar-bg);
      border: 2px solid var(--accent-yellow);
      padding: 6px 14px; border-radius: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    .navbar-right { display: flex; align-items: center; gap: 10px; }
    .platform-logo-wrapper { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent-yellow); overflow: hidden; }
    .platform-logo-img { width: 100%; height: 100%; object-fit: cover; }

    .btn-main {
      background-color: var(--accent-yellow); color: #000;
      border: none; padding: 8px 16px; border-radius: 20px;
      font-weight: bold; cursor: pointer; transition: transform 0.2s;
    }
    .btn-main:hover { transform: scale(1.03); }

    .btn-danger {
      background-color: #ff4d4d; color: #fff;
      border: none; padding: 6px 12px; border-radius: 12px; font-size: 12px; cursor: pointer;
    }

    .main-container { max-width: 950px; margin: 0 auto; padding: 0 15px; }
    .section-card {
      background-color: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 20px; margin-bottom: 20px;
    }

    .input-field {
      width: 100%; padding: 10px; margin-bottom: 10px;
      border-radius: 8px; border: 1px solid var(--border-color);
      background-color: var(--input-bg); color: var(--text-color); box-sizing: border-box;
    }

    .hidden { display: none !important; }

    /* صندوق المحادثة الجماعية */
    .chat-box {
      height: 200px; overflow-y: auto; border: 1px solid var(--border-color);
      border-radius: 8px; padding: 10px; background-color: var(--input-bg); margin-bottom: 10px;
    }
    .chat-msg { margin-bottom: 8px; padding: 6px 10px; border-radius: 8px; background: rgba(255,204,0,0.1); }
    .chat-msg strong { color: var(--accent-yellow); }

    .sections-bar { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; }
    .category-tab {
      background: var(--input-bg); border: 1px solid var(--border-color);
      color: var(--text-color); padding: 6px 14px; border-radius: 15px; cursor: pointer;
    }
    .category-tab.active { background: var(--accent-yellow); color: #000; font-weight: bold; }

    /* كروت الاختبارات */
    .quiz-card {
      border: 1px solid var(--accent-yellow);
      padding: 15px; border-radius: 12px; margin-bottom: 15px; background-color: var(--input-bg);
    }
    .option-btn {
      display: block; width: 100%; text-align: right; margin: 6px 0;
      padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--card-bg); color: var(--text-color); cursor: pointer;
    }
    .option-btn:hover { border-color: var(--accent-yellow); }
  </style>
</head>
<body>

  <!-- الشريط العلوي -->
  <div class="top-navbar-container">
    <div class="navbar-right">
      <div class="platform-logo-wrapper">
        <img src="https://i.ibb.co/3ykXj1Z/alsaidi-logo.jpg" class="platform-logo-img" alt="Logo">
      </div>
      <span id="userInfo">غير مسجل دخول</span>
    </div>
    <div>
      <button id="authBtn" class="btn-main" onclick="toggleAuth()">تسجيل الدخول بجيميل 🚀</button>
      <button class="btn-main" onclick="toggleTheme()">☀️/🌙</button>
    </div>
  </div>

  <div class="main-container">

    <!-- 👑 لوحة تحكم المالك فقط (youssef57255@gmail.com) -->
    <div id="adminPanel" class="section-card hidden">
      <h2 style="color: var(--accent-yellow);">👑 لوحة تحكم المالك (مستر يوسف)</h2>

      <!-- 1. إضافة الأعضاء -->
      <h3>👥 إضافة عضو/مشترك جديد:</h3>
      <div style="display: flex; gap: 10px;">
        <input type="email" id="newStudentEmail" class="input-field" placeholder="بريد الطالب (Gmail)...">
        <input type="number" id="newStudentDays" class="input-field" placeholder="عدد الأيام..." style="width: 120px;">
        <button class="btn-main" onclick="addStudent()">إضافة المشترك</button>
      </div>
      <div id="studentsList" style="margin-top: 10px;"></div>

      <hr style="border-color: var(--border-color); margin: 20px 0;">

      <!-- 2. إنشاء اختبار جديد -->
      <h3>📝 إنشاء اختبار جديد للطلاب:</h3>
      <input type="text" id="quizTitle" class="input-field" placeholder="عنوان الاختبار (مثال: اختبار الفصل الأول في الفيزياء)...">
      <input type="text" id="quizQuestion" class="input-field" placeholder="السؤال...">
      <input type="text" id="optA" class="input-field" placeholder="الخيار الأول (أ)">
      <input type="text" id="optB" class="input-field" placeholder="الخيار الثاني (ب)">
      <input type="text" id="optC" class="input-field" placeholder="الخيار الثالث (ج)">
      <select id="correctOpt" class="input-field">
        <option value="A">الخيار الصحيح: (أ)</option>
        <option value="B">الخيار الصحيح: (ب)</option>
        <option value="C">الخيار الصحيح: (ج)</option>
      </select>
      <button class="btn-main" onclick="createQuiz()">نشر الاختبار 📝</button>

      <hr style="border-color: var(--border-color); margin: 20px 0;">

      <!-- 3. إدارة الأقسام والدروس -->
      <h3>📂 إدارة الأقسام والرفع:</h3>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="newCatInput" class="input-field" placeholder="اسم القسم الجديد...">
        <button class="btn-main" onclick="addCategory()">إضافة قسم</button>
      </div>
    </div>

    <!-- 💬 الدردشة الجماعية -->
    <div class="section-card">
      <h3 style="color: var(--accent-yellow);">💬 الدردشة الجماعية للمنصة</h3>
      <div class="chat-box" id="chatBox"></div>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="chatInput" class="input-field" placeholder="اكتب رسالتك هنا..." style="margin-bottom:0;">
        <button class="btn-main" onclick="sendChatMessage()">إرسال</button>
      </div>
    </div>

    <!-- 📝 منطقة الاختبارات المتاحة للطلاب -->
    <div class="section-card">
      <h2 style="color: var(--accent-yellow);">📝 الاختبارات والتطبيقات</h2>
      <div id="quizzesArea">
        <p style="opacity: 0.7;">جاري تحميل الاختبارات المتاحة...</p>
      </div>
    </div>

  </div>

  <script>
    // --- إعدادات Firebase ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const ADMIN_EMAIL = "youssef57255@gmail.com";
    let currentUser = null;

    function toggleAuth() {
      if (auth.currentUser) { auth.signOut(); } 
      else { auth.signInWithPopup(new firebase.GoogleAuthProvider()); }
    }

    auth.onAuthStateChanged(user => {
      currentUser = user;
      const userInfo = document.getElementById('userInfo');
      const authBtn = document.getElementById('authBtn');
      const adminPanel = document.getElementById('adminPanel');

      if (user) {
        userInfo.innerText = user.displayName || user.email;
        authBtn.innerText = "تسجيل الخروج";
        if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          adminPanel.classList.remove('hidden');
        } else {
          adminPanel.classList.add('hidden');
        }
      } else {
        userInfo.innerText = "غير مسجل دخول";
        authBtn.innerText = "تسجيل الدخول بجيميل 🚀";
        adminPanel.classList.add('hidden');
      }
    });

    // --- نظام إنشاء وحل الاختبارات ---
    function createQuiz() {
      const title = document.getElementById('quizTitle').value.trim();
      const question = document.getElementById('quizQuestion').value.trim();
      const a = document.getElementById('optA').value.trim();
      const b = document.getElementById('optB').value.trim();
      const c = document.getElementById('optC').value.trim();
      const correct = document.getElementById('correctOpt').value;

      if (!title || !question || !a || !b || !c) return alert('يرجى ملء جميع بيانات الاختبار كاملة');

      db.collection('quizzes').add({
        title, question,
        options: { A: a, B: b, C: c },
        correct,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert('تم نشر الاختبار بنجاح!');
        document.getElementById('quizTitle').value = '';
        document.getElementById('quizQuestion').value = '';
        document.getElementById('optA').value = '';
        document.getElementById('optB').value = '';
        document.getElementById('optC').value = '';
      });
    }

    db.collection('quizzes').onSnapshot(snapshot => {
      const area = document.getElementById('quizzesArea');
      area.innerHTML = '';

      if (snapshot.empty) {
        area.innerHTML = '<p>لا توجد اختبارات متاحة حالياً.</p>';
        return;
      }

      snapshot.forEach(doc => {
        const q = doc.data();
        area.innerHTML += `
          <div class="quiz-card">
            <h4>📌 ${q.title}</h4>
            <p><strong>س: ${q.question}</strong></p>
            <button class="option-btn" onclick="checkAnswer('${q.correct}', 'A')">أ) ${q.options.A}</button>
            <button class="option-btn" onclick="checkAnswer('${q.correct}', 'B')">ب) ${q.options.B}</button>
            <button class="option-btn" onclick="checkAnswer('${q.correct}', 'C')">ج) ${q.options.C}</button>
          </div>
        `;
      });
    });

    function checkAnswer(correct, selected) {
      if (selected === correct) {
        alert('🎉 إجابة صحيحة! أحسنت.');
      } else {
        alert('❌ إجابة خاطئة، حاول مرة أخرى!');
      }
    }

    // --- الدردشة والمظهر ---
    function sendChatMessage() {
      const msg = document.getElementById('chatInput').value;
      if (!msg || !currentUser) return alert('يرجى تسجيل الدخول وإدخال الرسالة');

      db.collection('chat').add({
        sender: currentUser.displayName || currentUser.email,
        text: msg,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      document.getElementById('chatInput').value = '';
    }

    db.collection('chat').orderBy('timestamp', 'asc').onSnapshot(snapshot => {
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        chatBox.innerHTML += `<div class="chat-msg"><strong>${data.sender}:</strong> ${data.text}</div>`;
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }
  </script>
</body>
</html>
